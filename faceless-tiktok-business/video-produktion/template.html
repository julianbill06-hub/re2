<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#C4A479}
body{font-family:"Inter Display","Inter","Noto Color Emoji",sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;background:linear-gradient(170deg,#CBAC80 0%,#C09E72 55%,#B6936A 100%)}
.tex{position:absolute;left:0;top:0;width:1080px;height:1920px}
#vig{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(85% 62% at 50% 46%,transparent 48%,rgba(50,30,10,.34))}
#prog{position:absolute;top:96px;left:60px;width:960px;height:12px;border-radius:6px;background:rgba(40,25,10,.18);overflow:hidden}
#progf{height:100%;width:0;background:#111;border-radius:6px}
#handle{position:absolute;bottom:120px;left:0;width:1080px;text-align:center;font-weight:700;font-size:40px;color:rgba(30,18,6,.62);letter-spacing:-.01em}
.tag{position:absolute;top:340px;left:0;width:1080px;display:flex;justify-content:center;opacity:0}
.tag span{background:#111;color:#fff;font-weight:700;font-size:46px;padding:14px 34px;border-radius:999px;box-shadow:0 10px 26px rgba(60,35,10,.30)}
.cap{position:absolute;top:500px;left:70px;width:860px;display:flex;justify-content:center;opacity:0}
.cap span.p{display:inline-block;background:#fff;color:#111;font-weight:800;font-size:74px;line-height:1.16;letter-spacing:-.025em;padding:20px 30px;border-radius:16px;text-align:center;box-shadow:0 10px 26px rgba(60,35,10,.30);max-width:860px}
.cap b{display:inline-block;background:#111;color:#FFC928;border-radius:12px;padding:0 14px;margin:2px 0;font-weight:800}
.hook{position:absolute;top:470px;left:60px;width:900px;display:flex;justify-content:center;opacity:0}
.hook div{background:#fff;color:#111;font-weight:800;font-size:92px;line-height:1.06;letter-spacing:-.035em;padding:36px 40px;border-radius:26px;text-align:center;box-shadow:0 26px 54px rgba(45,26,8,.45)}
.hook b{color:#111;background:#FFC928;border-radius:14px;padding:0 14px;font-weight:900}
.panel{position:absolute;top:900px;left:90px;width:840px;opacity:0}
.stat{background:#141414;border-radius:30px;padding:46px 40px 50px;text-align:center;box-shadow:0 26px 54px rgba(45,26,8,.45)}
.stat .n{font-weight:800;font-size:170px;line-height:1;color:#FFC928;letter-spacing:-.04em}
.stat .l{font-weight:600;font-size:40px;color:rgba(255,255,255,.72);margin-top:18px;line-height:1.2}
.vs{display:flex;gap:26px}
.vs .stat{flex:1;padding:40px 20px 44px}
.vs .stat .n{font-size:112px}
.vs .bad .n{color:#ff7a5c}
.list{background:#141414;border-radius:30px;padding:34px 40px;box-shadow:0 26px 54px rgba(45,26,8,.45)}
.list .it{display:flex;align-items:center;gap:26px;font-weight:700;font-size:58px;color:#fff;padding:16px 0;opacity:0}
.list .ic{width:84px;height:84px;border-radius:22px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:50px;flex:none}
.list .ok .ic{background:#FFC928;color:#111}
.list .no .ic{background:#ff7a5c;color:#111}
.cta{background:#FFC928;border-radius:30px;padding:46px 40px;text-align:center;box-shadow:0 26px 54px rgba(45,26,8,.45)}
.cta .e{font-size:120px;line-height:1}
.cta .l{font-weight:800;font-size:56px;color:#111;margin-top:16px;letter-spacing:-.02em;line-height:1.15}
</style></head><body>
<div id="bg"></div>
<svg class="tex" width="1080" height="1920" style="mix-blend-mode:multiply;opacity:.34"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1920" filter="url(#g)"/></svg>
<svg class="tex" width="1080" height="1920" style="mix-blend-mode:overlay;opacity:.20"><filter id="f"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.42" numOctaves="3" seed="8"/><feColorMatrix type="saturate" values="0"/></filter><rect width="1080" height="1920" filter="url(#f)"/></svg>
<div id="vig"></div>
<div id="prog"><div id="progf"></div></div>
<div id="layer"></div>
<div id="handle">@clever.zuhause</div>
<script>
const V = __DATA__;
const outBack = t => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(t-1,3) + c1*Math.pow(t-1,2); };
const clamp = (x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const L = document.getElementById('layer');
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function hl(text, words){ // Schlüsselwörter als dunkle Innen-Pill
  let h = esc(text);
  (words||[]).forEach(w=>{ h = h.split(esc(w)).join('<b>'+esc(w)+'</b>'); });
  return h;
}
function mk(cls, html){ const d=document.createElement('div'); d.className=cls; d.innerHTML=html; L.appendChild(d); return d; }
// Elemente vorbauen
V.tags.forEach(g=>{ g.el = mk('tag','<span>'+esc(g.text)+'</span>'); });
V.caps.forEach(c=>{ c.el = mk('cap','<span class="p">'+hl(c.text,c.hl)+'</span>'); });
if (V.hook) V.hook.el = mk('hook','<div>'+V.hook.html+'</div>');
V.panels.forEach(p=>{
  const d=p.data; let h='';
  if (d.type==='stat') h='<div class="stat"><div class="n">'+esc(d.num)+'</div><div class="l">'+esc(d.label)+'</div></div>';
  if (d.type==='vs') h='<div class="vs"><div class="stat bad"><div class="n">'+esc(d.a.num)+'</div><div class="l">'+esc(d.a.label)+'</div></div><div class="stat"><div class="n">'+esc(d.b.num)+'</div><div class="l">'+esc(d.b.label)+'</div></div></div>';
  if (d.type==='list') h='<div class="list">'+d.items.map(i=>'<div class="it '+(i.s||'')+'"><div class="ic">'+i.i+'</div><div>'+esc(i.t)+'</div></div>').join('')+'</div>';
  if (d.type==='cta') h='<div class="cta"><div class="e">'+d.e+'</div><div class="l">'+esc(d.label)+'</div></div>';
  p.el = mk('panel', h);
  p.items = [...p.el.querySelectorAll('.it')];
  const m = d.type==='stat' && /^(\D*)(\d+(?:[.,]\d+)?)(\D*)$/.exec(d.num);
  if (m && d.count!==false){ p.cnt={pre:m[1],val:parseFloat(m[2].replace(',','.')),dec:(m[2].split(/[.,]/)[1]||'').length,suf:m[3],el:p.el.querySelector('.n'),sep:m[2].includes(',')?',':'.'}; }
});
function pop(el, t, s, e, fadeOut=0.15){
  if (t<s || t>=e){ el.style.opacity=0; return false; }
  const a = clamp((t-s)/0.22), o = clamp((e-t)/fadeOut);
  const sc = 0.82 + 0.18*outBack(a);
  el.style.opacity = Math.min(clamp(a*3), o);
  el.style.transform = 'scale('+sc+') translateY('+((1-o)*-20)+'px)';
  return true;
}
window.setT = function(t){
  document.getElementById('progf').style.width = (100*t/V.dur)+'%';
  V.tags.forEach(g=>pop(g.el,t,g.s,g.e));
  V.caps.forEach(c=>pop(c.el,t,c.s,c.e,0.06));
  if (V.hook){ const h=V.hook; if (t<h.e){ const a=clamp(t/0.18); h.el.style.opacity=Math.min(1,0.4+a)*clamp((h.e-t)/0.2); h.el.style.transform='scale('+(0.9+0.1*outBack(a))+') rotate(-1.5deg)'; } else h.el.style.opacity=0; }
  V.panels.forEach(p=>{
    if (!pop(p.el,t,p.s,p.e)) return;
    if (p.cnt){ const k=clamp((t-p.s)/Math.max(0.4,(p.ce-p.s)*0.8)); const v=p.cnt.val*(1-Math.pow(1-k,3));
      p.cnt.el.textContent = p.cnt.pre + v.toFixed(p.cnt.dec).replace('.',p.cnt.sep) + p.cnt.suf; }
    p.items.forEach((it,i)=>{ const s=p.itemT[i]; const a=clamp((t-s)/0.2); it.style.opacity=a; it.style.transform='translateX('+((1-outBack(a))*-40)+'px)'; });
  });
};
window.__ready = true;
</script></body></html>
